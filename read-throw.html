<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Read &amp; Throw | QB Sense VR</title>
<script src="analytics.js" defer></script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0a1628;font-family:system-ui,Arial,sans-serif}
  canvas{display:block;touch-action:none;cursor:grab}
  canvas:active{cursor:grabbing}
  .panel{position:fixed;background:rgba(10,22,40,.85);color:#fff;border-radius:10px;padding:10px 12px;font-size:13px}
  #bar{left:12px;right:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  #info{left:12px;top:12px;max-width:340px;line-height:1.45}
  button{background:#1e293b;color:#fff;border:1px solid #475569;border-radius:6px;padding:8px 10px;font:inherit;font-weight:700;cursor:pointer}
  button.on{background:#166534;border-color:#22c55e}
  #bar label{display:flex;align-items:center;gap:4px}
  /* Inside the Two-Minute Drill the drive picks the plays, so series, menus, slow motion and the answer are hidden. */
  .drive #series,.drive #random,.drive #slow,.drive #reveal,.drive #bar label,.drive #back{display:none}
  .drive #info{max-width:300px;font-size:12px}
  /* Full-screen drive, kept sparse: the play call (with the look-around tip) sits next to the drive's
     Back button, the height and view sliders are hidden, and the button bar only appears while the
     ball is live, with just the throws. Snap, replay, top view and names stay on Space, W, V and N.
     The drive's scoreboard runs along the bottom (about 72 px), so the bar sits above it. */
  .hud #info{left:170px}
  .hud #info .setting{display:none}
  .hud #bar{left:50%;right:auto;transform:translateX(-50%);bottom:84px;display:none}
  .hud.live #bar{display:flex}
  .hud #bar > :not(#throw):not(#lob):not(#away){display:none}
  .hud #result{top:108px;max-height:calc(100vh - 230px)}
  select{background:#1e293b;color:#fff;border:1px solid #475569;border-radius:6px;padding:7px 6px;font:inherit;font-weight:700}
  .setting{display:flex;align-items:center;gap:6px;margin-top:6px}
  .setting input{width:110px}
  #clock{right:12px;top:12px;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
  #clock.late{background:#b91c1c}
  #playcard{right:12px;top:12px;width:250px;padding:8px 10px}
  #playcard svg{display:block;width:100%;height:auto;margin-top:6px}
  /* On narrower screens in the full-screen drive, keep the play call clear of the play card. */
  @media (max-width: 1000px) { .drive.hud #info{max-width:calc(100% - 480px)} }
  #snap{background:#b45309;border-color:#f59e0b}
  #back{color:#fff;font-weight:700;padding:8px 4px}
  button:disabled{opacity:.4;cursor:default}
  #cross{position:fixed;left:50%;top:50%;width:2px;height:34px;margin:-17px 0 0 -1px;background:#facc15;pointer-events:none}
  #power{left:50%;transform:translateX(-50%);bottom:110px;width:220px;text-align:center;pointer-events:none}
  #power div{height:10px;margin-top:4px;background:#334155;border-radius:5px;overflow:hidden}
  #powerFill{display:block;height:100%;background:#f59e0b}
  #result{left:50%;transform:translateX(-50%);top:70px;width:min(460px,86vw);text-align:center;z-index:2;max-height:calc(100vh - 190px);overflow:auto}
  #resultTitle{font-size:20px}
  #resultText{white-space:pre-line;margin:8px 0 10px;line-height:1.45;text-align:left}
  #answer{margin-top:6px;color:#fde68a}
  #error{left:12px;right:12px;top:40%;display:none;text-align:center}
</style>
</head>
<body>
<div id="info" class="panel">
  <b id="title"></b>
  <div>Drag the mouse (or use the ← → ↑ ↓ arrows) to look around.</div>
  <div class="setting">Your height: <input id="height" type="range" min="160" max="205" value="185"> <span id="heightText">185 cm</span></div>
  <div class="setting">Field of view: <input id="fov" type="range" min="40" max="75" value="55"> <span id="fovText">natural</span></div>
  <div id="answer" hidden></div>
</div>
<div id="bar" class="panel">
  <a id="back" href="index.html#drills">← Drills</a>
  <button id="snap">Snap (Space)</button>
  <button id="watch" disabled>Watch last rep (W)</button>
  <button id="throw">Bullet pass (hold Space)</button>
  <button id="lob">Lob pass (hold L)</button>
  <button id="away" disabled>Throw away (T)</button>
  <button id="series">10-rep series</button>
  <button id="slow">Slow motion (S)</button>
  <button id="random">Random situation (R)</button>
  <label>Play <select id="conceptPick" title="Offensive concept"></select></label>
  <label>Defense <select id="coveragePick" title="Defensive coverage"></select></label>
  <button id="reveal">Show answer</button>
  <button id="view">Top view (V)</button>
  <button id="labels" class="on">Names (N)</button>
</div>
<div id="clock" class="panel" hidden></div>
<div id="playcard" class="panel" hidden><b id="pcTitle"></b><svg id="pcSvg" viewBox="0 0 240 170" role="img" aria-label="Overhead diagram of your play"></svg></div>
<div id="cross" hidden></div>
<div id="power" class="panel" hidden>Power<div><span id="powerFill"></span></div></div>
<div id="result" class="panel" hidden>
  <b id="resultTitle"></b>
  <div id="resultText"></div>
  <button id="replay">Replay (Space)</button> <button id="next"></button>
</div>
<div id="error" class="panel">The 3D view could not load. Check your internet connection, then reload the page.</div>
<script>
  // Shown if the 3D library cannot be downloaded or WebGL is unavailable.
  setTimeout(function(){ if(!window.qb) document.getElementById('error').style.display='block'; }, 8000);
</script>
<script src="stadium.js"></script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

// Data is in yards: x = left (-) / right (+), d = distance past the line of scrimmage (- = offence side).
const YD = 0.9144;
const world = (x, d) => new THREE.Vector3(x * YD, 0, -d * YD);
// Drive mode: the page runs inside the Two-Minute Drill, which owns the clock, downs and score.
const DRIVE = new URLSearchParams(location.search).has('drive');
if (DRIVE) document.documentElement.classList.add('drive');

const OFFENCE = [
  ['LT', -3.2, -0.6], ['LG', -1.6, -0.5], ['C', 0, -0.3], ['RG', 1.6, -0.5], ['RT', 3.2, -0.6],
  ['TE', 4.9, -0.6], ['X', -19, -0.5], ['Slot', -11, -1.4], ['Z', 19, -1.4], ['RB', 1.8, -5], ['QB', 0, -5],
];
const FRONT = { DE1: [-4.6, 0.8], DT1: [-1.4, 0.8], DT2: [1.4, 0.8], DE2: [5.9, 0.8] };
const SITUATIONS = [
  { name: 'Cover 3, no blitz',
    answer: 'Slant (X): the Nickel has the flat zone and widens toward the sideline.',
    back: { CB1: [-19, 7], CB2: [19, 7], FS: [0, 13], SS: [7, 8], Nickel: [-10, 5], LB1: [-2.8, 4.5], LB2: [2.8, 4.5] } },
  { name: 'Cover 1 (man), no blitz',
    answer: 'Slant (X). Flat (Slot) is acceptable if he is open.',
    back: { CB1: [-19, 4], CB2: [19, 4], FS: [0, 14], SS: [5.5, 6], Nickel: [-11, 4], LB1: [-2.8, 4.5], LB2: [2.8, 4.5] } },
  { name: 'Cover 1, linebacker blitz from the left',
    answer: 'Slant (X) into the space he leaves. Flat is acceptable. Clue: LB1 creeps toward the line.',
    back: { CB1: [-19, 4], CB2: [19, 4], FS: [0, 14], SS: [5.5, 6], Nickel: [-11, 4], LB1: [-2.9, 2.8], LB2: [2.8, 4.5] } },
  { name: 'Slot defender blitz, zone behind it',
    answer: 'Slot right away. Slant is acceptable before 1.5 s. Clues: the Nickel walks in and the FS slides left.',
    back: { CB1: [-19, 7], CB2: [19, 7], FS: [-6, 11], SS: [7, 8], Nickel: [-9, 2.8], LB1: [-2.8, 4.5], LB2: [2.8, 4.5] } },
];

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
// The haze colour matches the sky at the horizon, so distant stands fade into it.
const HAZE = 0xb4cde6;
scene.background = new THREE.Color(HAZE);
scene.fog = new THREE.Fog(HAZE, 130, 340);
scene.add(new THREE.HemisphereLight(0xffffff, 0x335533, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(20, 40, 10);
scene.add(sun);
const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 900);

function canvasTexture(width, height, draw) {
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  draw(canvas.getContext('2d'), width, height);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return texture;
}

// Field: 53 1/3 yards wide, 120 long. The ball is on the offence's own 30-yard line.
const WIDTH = 160 / 3, LOS_FROM_BACK = 40;
const field = canvasTexture(1024, 2304, (c, w, h) => {
  const px = w / WIDTH, py = h / 120;
  for (let i = 0; i < 24; i++) {
    c.fillStyle = i % 2 ? '#2f7d3a' : '#2a7234';
    c.fillRect(0, i * 5 * py, w, 5 * py + 1);
  }
  c.fillStyle = '#14532d';
  c.fillRect(0, 0, w, 10 * py);
  c.fillRect(0, 110 * py, w, 10 * py);
  c.fillStyle = '#fff';
  for (let y = 10; y <= 110; y += 5) c.fillRect(0, y * py - 2, w, 4);
  // College hash marks are 20 yards from each sideline.
  for (let y = 11; y < 110; y++) for (const x of [0.5, 20, WIDTH - 20, WIDTH - 0.5]) c.fillRect(x * px - 8, y * py - 1, 16, 3);
  c.font = 'bold 44px Arial';
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  for (let y = 20; y <= 100; y += 10) {
    const n = String(50 - Math.abs(60 - y));
    for (const [x, turn] of [[8, Math.PI / 2], [WIDTH - 8, -Math.PI / 2]]) {
      c.save(); c.translate(x * px, y * py); c.rotate(turn); c.fillText(n, 0, 0); c.restore();
    }
  }
});
function flat(width, length, material, x, d, y) {
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(width * YD, length * YD), material);
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.copy(world(x, d)).setY(y);
  scene.add(mesh);
  return mesh;
}
flat(300, 300, new THREE.MeshLambertMaterial({ color: 0x24502c }), 0, 20, -0.05);
// By default the back end line is 40 yards behind the ball (own 30). In a drive, setField moves it.
const fieldMesh = flat(WIDTH, 120, new THREE.MeshLambertMaterial({ map: field }), 0, 60 - LOS_FROM_BACK, 0);
flat(WIDTH, 0.18, new THREE.MeshBasicMaterial({ color: 0x2563eb }), 0, 0, 0.015);
const firstDownLine = flat(WIDTH, 0.18, new THREE.MeshBasicMaterial({ color: 0xfacc15 }), 0, 10, 0.015);

const box = (w, h, d, color) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color }));
// The stadium, sky and crowd come from stadium.js, shared with the other 3D drills.
const park = window.qbStadium(THREE, renderer);
const stadium = park.stadium;
scene.add(park.sky, stadium);
// The stadium is built around the middle of the field.
stadium.position.copy(world(0, 60 - LOS_FROM_BACK));
const goalPosts = [-LOS_FROM_BACK, 120 - LOS_FROM_BACK].map((d) => {
  const posts = new THREE.Group();
  for (const [w, h, x, y] of [[0.2, 3, 0, 1.5], [5.7, 0.15, 0, 3], [0.15, 7, -2.8, 6.5], [0.15, 7, 2.8, 6.5]]) {
    const post = box(w, h, 0.2, 0xfacc15);
    post.position.set(x, y, 0);
    posts.add(post);
  }
  posts.position.copy(world(0, d));
  scene.add(posts);
  return posts;
});
// Passes landing past the back of the end zone are incomplete. Off the field by default.
let endLine = Infinity;
// Moves the field so the ball is "ball" yards from the opponent's goal line, with the
// first-down line "toGo" yards ahead (hidden when it is goal to go).
function setField(ball, toGo) {
  const fromBack = 110 - ball;
  fieldMesh.position.copy(world(0, 60 - fromBack));
  stadium.position.copy(world(0, 60 - fromBack));
  goalPosts[0].position.copy(world(0, -fromBack));
  goalPosts[1].position.copy(world(0, 120 - fromBack));
  firstDownLine.position.copy(world(0, toGo)).setY(0.015);
  firstDownLine.visible = toGo < ball;
  endLine = ball + 10;
}

function label(text, color) {
  const map = canvasTexture(256, 96, (c, w, h) => {
    c.fillStyle = color;
    c.beginPath(); c.roundRect(8, 8, w - 16, h - 16, 24); c.fill();
    c.fillStyle = '#fff';
    c.font = 'bold 48px Arial';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillText(text, w / 2, h / 2 + 2);
  });
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map, depthTest: false }));
  sprite.scale.set(1.1, 0.41, 1);
  sprite.position.y = 2.35;
  return sprite;
}

const SKIN = new THREE.MeshLambertMaterial({ color: 0xb98563 });
// Football stances for a player of about 1.88 m, in metres. The body faces -z (negative z is forward).
// Pairs are [left, right]; each point is [x, y, z].
const mirror = ([x, y, z]) => [[-x, y, z], [x, y, z]];
const STANCES = {
  // Defensive line and tight end: three-point stance, right hand on the ground.
  threePoint: { feet: [[-0.26, 0.07, 0.12], [0.26, 0.07, 0.38]], knees: [[-0.27, 0.46, -0.14], [0.26, 0.4, 0.06]],
    hip: [0, 0.78, 0.18], chest: [0, 0.82, -0.32], head: [0, 0.96, -0.55],
    elbows: [[-0.36, 0.62, -0.3], [0.24, 0.45, -0.44]], hands: [[-0.27, 0.52, -0.1], [0.16, 0.06, -0.52]] },
  // Offensive line in shotgun pass protection: low two-point stance.
  protect: { feet: mirror([0.32, 0.07, 0.08]), knees: mirror([0.34, 0.45, -0.16]),
    hip: [0, 0.76, 0.14], chest: [0, 1.18, -0.1], head: [0, 1.38, -0.2],
    elbows: mirror([0.38, 0.92, -0.18]), hands: mirror([0.24, 0.84, -0.42]) },
  // Linebackers: knees bent, chest forward, hands ready.
  linebacker: { feet: mirror([0.28, 0.07, 0]), knees: mirror([0.28, 0.5, -0.14]),
    hip: [0, 0.9, 0.08], chest: [0, 1.35, -0.1], head: [0, 1.58, -0.18],
    elbows: mirror([0.37, 1.07, -0.1]), hands: mirror([0.27, 0.9, -0.34]) },
  // Defensive backs and receivers: light bend, one foot in front.
  ready: { feet: [[-0.2, 0.07, -0.2], [0.2, 0.07, 0.25]], knees: [[-0.2, 0.52, -0.18], [0.2, 0.51, 0.08]],
    hip: [0, 0.95, 0.04], chest: [0, 1.43, -0.08], head: [0, 1.67, -0.13],
    elbows: mirror([0.35, 1.15, -0.02]), hands: mirror([0.29, 0.96, -0.2]) },
};
function stanceFor(name) {
  if (['DE', 'DT', 'TE'].includes(name)) return STANCES.threePoint;
  if (['LT', 'LG', 'C', 'RG', 'RT'].includes(name)) return STANCES.protect;
  if (name === 'LB') return STANCES.linebacker;
  return STANCES.ready;
}

const UP = new THREE.Vector3(0, 1, 0);
const material = (color, shine = 8) => new THREE.MeshPhongMaterial({ color, shininess: shine, specular: 0x222222 });
const KIT = {
  offence: { jersey: material(0x1746a8), pants: material(0xd9dee6, 30), helmet: material(0x143a8c, 90), trim: material(0xffffff, 40), number: '#ffffff' },
  defence: { jersey: material(0xb91c1c), pants: material(0x232b36, 30), helmet: material(0x991b1b, 90), trim: material(0xf1f5f9, 40), number: '#ffffff' },
};
const SKINS = [0xc68e6a, 0x9a6444, 0x6f442d, 0xe0ac86].map((color) => material(color));
const DARK = material(0x14161a, 20), MASK = material(0xaab2bd, 90), SOCK = material(0xf4f4f5);
const NUMBERS = { LT: 74, LG: 66, C: 55, RG: 63, RT: 78, TE: 87, X: 11, Slot: 3, Z: 80, RB: 22, QB: 12,
  DE1: 91, DT1: 95, DT2: 99, DE2: 94, CB1: 21, CB2: 24, FS: 32, SS: 36, Nickel: 29, LB1: 52, LB2: 54 };

const vector = (p) => new THREE.Vector3(...p);
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
function add(group, geometry, mat, position) {
  const mesh = new THREE.Mesh(geometry, mat);
  if (position) mesh.position.set(...position);
  group.add(mesh);
  return mesh;
}
const ball = (group, at, radius, mat, scale = [1, 1, 1]) => {
  const mesh = add(group, new THREE.SphereGeometry(radius, 18, 14), mat, at);
  mesh.scale.set(...scale);
  return mesh;
};
// A muscle-like segment: thicker at one end, with rounded joints.
function limb(group, from, to, r1, r2, mat) {
  const a = vector(from), b = vector(to);
  const mesh = add(group, new THREE.CylinderGeometry(r2, r1, a.distanceTo(b), 14, 1, true), mat);
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(UP, b.sub(a).normalize());
  ball(group, from, r1, mat);
  ball(group, to, r2, mat);
  return mesh;
}

// Waist to shoulders: wider than deep, with a number on the chest and the back.
function torso(body, hip, chest, kit, number) {
  const direction = vector(chest).sub(vector(hip));
  const length = direction.length();
  const part = new THREE.Group();
  part.position.copy(vector(hip));
  part.quaternion.setFromUnitVectors(UP, direction.normalize());
  const profile = [[0.001, 0], [0.15, 0.02], [0.135, 0.2], [0.17, 0.55], [0.215, 0.85], [0.18, 1.02], [0.001, 1.08]]
    .map(([r, t]) => new THREE.Vector2(r, t * length));
  add(part, new THREE.LatheGeometry(profile, 24), kit.jersey).scale.set(1.2, 1, 0.8);
  add(part, new THREE.CylinderGeometry(0.153, 0.153, 0.06, 20), DARK, [0, 0.05 * length, 0]).scale.set(1.2, 1, 0.8);
  const map = canvasTexture(128, 128, (c) => {
    c.fillStyle = kit.number;
    c.font = 'bold 96px Arial';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillText(number, 64, 70);
  });
  const print = new THREE.MeshBasicMaterial({ map, transparent: true });
  for (const side of [-1, 1]) {
    const plate = add(part, new THREE.PlaneGeometry(0.27, 0.27), print, [0, 0.68 * length, side * 0.178]);
    if (side < 0) plate.rotation.y = Math.PI;
  }
  body.add(part);
}

function helmet(body, head, kit, skin) {
  const part = new THREE.Group();
  part.position.set(...head);
  ball(part, [0, 0, 0], 0.145, kit.helmet, [0.95, 1, 1.08]);
  // Face opening, then the cage in front of it.
  ball(part, [0, -0.025, -0.095], 0.082, skin, [1, 1.05, 0.8]);
  for (const x of [-0.03, 0.03]) ball(part, [x, -0.005, -0.163], 0.011, DARK);
  for (const [y, radius] of [[-0.035, 0.158], [-0.08, 0.152], [-0.12, 0.13]]) {
    const bar = add(part, new THREE.TorusGeometry(radius, 0.007, 6, 24, Math.PI * 0.62), MASK, [0, y, -0.018]);
    bar.rotation.set(-Math.PI / 2, 0, Math.PI * 0.19);
  }
  limb(part, [0, -0.035, -0.176], [0, -0.12, -0.148], 0.007, 0.007, MASK);
  for (const side of [-1, 1]) ball(part, [side * 0.135, -0.025, 0], 0.028, DARK, [0.4, 1, 1]);
  // Centre stripe from forehead to neck.
  const stripe = add(part, new THREE.TorusGeometry(0.146, 0.012, 6, 30, Math.PI * 0.95), kit.trim);
  stripe.rotation.y = -Math.PI / 2;
  stripe.scale.x = 1.08;
  body.add(part);
}

const shadowMap = canvasTexture(128, 128, (c) => {
  const fade = c.createRadialGradient(64, 64, 4, 64, 64, 62);
  fade.addColorStop(0, 'rgba(0,0,0,.5)');
  fade.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = fade;
  c.fillRect(0, 0, 128, 128);
});
const shadowMaterial = new THREE.MeshBasicMaterial({ map: shadowMap, transparent: true, depthWrite: false });

function player(name, offence, id = name) {
  const kit = offence ? KIT.offence : KIT.defence;
  const pose = stanceFor(name);
  const number = NUMBERS[id] ?? 40;
  const skin = SKINS[number % SKINS.length];
  // Linemen are bigger than backs and receivers.
  const bulk = ['LT', 'LG', 'C', 'RG', 'RT', 'DE', 'DT'].includes(name) ? 1.18 : ['TE', 'LB'].includes(name) ? 1.07 : 0.95;
  const group = new THREE.Group();
  const body = new THREE.Group();
  const { hip, chest, head } = pose;
  for (const [i, side] of [[0, -1], [1, 1]]) {
    const hipJoint = [side * 0.12 * bulk, hip[1], hip[2]];
    const knee = pose.knees[i], foot = pose.feet[i];
    const ankle = [foot[0], foot[1] + 0.04, foot[2]];
    // Thigh and pants down to just below the knee, then sock and cleat.
    limb(body, hipJoint, knee, 0.118 * bulk, 0.072 * bulk, kit.pants);
    const cuff = mix(knee, ankle, 0.18);
    limb(body, knee, cuff, 0.07 * bulk, 0.066 * bulk, kit.pants);
    const calf = mix(knee, ankle, 0.42);
    limb(body, cuff, calf, 0.06 * bulk, 0.078 * bulk, SOCK);
    limb(body, calf, ankle, 0.078 * bulk, 0.044, SOCK);
    limb(body, [foot[0], 0.06, foot[2] + 0.05], [foot[0], 0.045, foot[2] - 0.15], 0.06, 0.042, DARK);

    const shoulder = [side * 0.25 * bulk, chest[1], chest[2]];
    const elbow = pose.elbows[i], hand = pose.hands[i];
    const sleeve = mix(shoulder, elbow, 0.4);
    limb(body, shoulder, sleeve, 0.1 * bulk, 0.082 * bulk, kit.jersey);
    limb(body, sleeve, elbow, 0.076 * bulk, 0.05 * bulk, skin);
    const wrist = mix(elbow, hand, 0.88);

// Where a runner is after "distance" yards along a route.
function along(points, distance) {
  for (let i = 1; i < points.length; i++) {
    const [ax, ad] = points[i - 1], [bx, bd] = points[i];
    const length = Math.hypot(bx - ax, bd - ad);
    if (distance <= length) return [ax + (bx - ax) * distance / length, ad + (bd - ad) * distance / length];
    distance -= length;
  }

}

// for each cut (the sharper the cut, the slower: a slant barely slows, an out or a dig sinks his hips,
// a curl or comeback stops and comes back), re-accelerates out of the break, and settles to a stop at
// the top of a hitch, curl, stick or sit. Returns the distance run along the route at every frame.
const ACCELERATE = 0.45, DECELERATE = 8;

    marks.push([total, i < route.length - 1 ? cornerSpeed(route[i - 1], route[i], route[i + 1], top) : 0]);
  }

  let d = 0, v = 0;

    if (k * STEP > delay) {

      let cap = top;
      for (const [at, limit] of marks) if (at > d) cap = Math.min(cap, Math.sqrt(limit * limit + 2 * DECELERATE * (at - d)));
      v = Math.min(cap, v + (top - v) * STEP / ACCELERATE);
      d = Math.min(total, d + v * STEP);

scene.add(routeGroup);

  svg += `<rect x="0" y="0" width="${W}" height="${H}" rx="8" fill="#14532d"/>`;

  svg += `<line x1="6" x2="${W - 6}" y1="${sy(0)}" y2="${sy(0)}" stroke="#60a5fa" stroke-width="2"/>`;

const offenceByName = Object.fromEntries(offence.map((p) => [p.userData.name, p]));

    limb(leg, [0, 0, 0], [0, -0.44, 0], 0.115 * bulk, 0.07 * bulk, kit.pants);

// ---------------------------------------------------------------- Throwing
// The ball leaves the quarterback's hand over the top, about 2.2 m up, as for a 6'2" passer.
const GRAVITY = 9.81, RELEASE = { x: 0.3, d: -4.8, y: 2.2 }, CATCH_HEIGHT = 1.3;
const MIN_YARDS = 5, MAX_YARDS = 45, CHARGE_SECONDS = 1.5, SERIES_LENGTH = 10;
const ELIGIBLE = ['X', 'Slot', 'Z', 'TE', 'RB'];
const FRONT_FOUR = Object.keys(FRONT);

// A throw that comes down at catch height "distance" yards away, in the direction of "heading".
// A bullet pass is fast and flat; a lob leaves at a high angle.
function trajectory(type, heading, distance) {
  const range = distance * YD, rise = CATCH_HEIGHT - RELEASE.y;
  let speed, angle;
  if (type === 'lob') {
    angle = 38 * Math.PI / 180;
    speed = Math.sqrt(GRAVITY * range * range / (2 * Math.cos(angle) ** 2 * (range * Math.tan(angle) - rise)));
  } else {
    speed = 22;
    let root;
    while ((root = speed ** 4 - GRAVITY * (GRAVITY * range * range + 2 * rise * speed * speed)) < 0) speed += 0.5;
    angle = Math.atan((speed * speed - Math.sqrt(root)) / (GRAVITY * range));
  }
  const dir = [-Math.sin(heading), Math.cos(heading)];
  const flat = speed * Math.cos(angle), up = speed * Math.sin(angle);
  return {
    type, flight: range / flat, target: [RELEASE.x + dir[0] * distance, RELEASE.d + dir[1] * distance],
    at: (s) => ({ x: RELEASE.x + dir[0] * flat * s / YD, d: RELEASE.d + dir[1] * flat * s / YD,
      y: RELEASE.y + up * s - GRAVITY * s * s / 2, traveled: flat * s / YD }),
  };
}

const frameAt = (t) => play.frames[Math.max(0, Math.min(play.frames.length - 1, Math.round(t / STEP)))];
const gap = (spot, point) => Math.hypot(spot[0] - point[0], spot[1] - point[1]);
// Pass rushers (the front four and any blitzer) keep rushing when the ball is thrown. They can only
// bat a pass that goes right through their hands, and cannot intercept it.
// A lineman who drops into coverage (simulated blitz) plays the ball like any other defender.
const rushing = (id) => {
  const job = play && play.jobs && play.jobs[id];
  return job ? job.type === 'rush' : FRONT_FOUR.includes(id);
};
// The receiver the ball is thrown to: the one closest to where it comes down, if any is within
// 7 yards. Only he plays the ball. A teammate it passes over or past does not reach up and take a
// pass meant for someone else, so you can throw over a shallow route to the deeper one on the same
// side, as in a real game. Defenders underneath can still undercut it.
function intendedFor(path, release) {
  const landing = frameAt(release + path.flight);
  const id = ELIGIBLE.filter((r) => landing[r]).reduce((a, b) => (gap(landing[b], path.target) < gap(landing[a], path.target) ? b : a));

}

// A defender intercepts when the ball is coming right at him; a glancing touch only deflects it.
function square(path, release, from, id) {

    if (ball.y > 0.5 && ball.y < 2.3 && gap(frameAt(release + s)[id], [ball.x, ball.d]) < 0.35) return true;
  }
  return false;
}

// How far a player can be from the ball at its arrival and still do something about it.
const STRETCH = 2.2, LUNGE = 3.8;

// ---------------------------------------------------------------- Playing the ball in the air
// Real limits for a player going after the ball: top speed, and how quickly he can speed up, stop
// or change direction (about 10 yd/s per second, so stopping from full speed and coming back takes
// close to a second, as on a real field).
const BALL_GRIP = 10, RECEIVER_TOP = 8, DEFENDER_TOP = 7.6;

// How long before a player sees the ball and starts to go after it.
// - A receiver facing the quarterback (hitch, curl, slant, crosser) sees it almost at once. One
//   running away from him on a deep route has to turn his head and find it over his shoulder.
// - A zone defender with his eyes on the quarterback breaks on the throw quickly. A defender in man
//   coverage, or a deep defender running with his back half turned, plays the receiver and only
//   finds the ball later. The farther away he is, the later he gets there.
function reactionTime(id, path, release, far) {
  const first = Math.round(release / STEP);

  const moving = [now[0] - before[0], now[1] - before[1]];
  const awayFromQB = moving[0] * (now[0] - QB_SPOT[0]) + moving[1] * (now[1] - QB_SPOT[1]) > 0 && Math.hypot(...moving) > 0.3;
  if (ELIGIBLE.includes(id)) return awayFromQB && now[1] > 10 ? 0.45 : 0.25;
  const job = play.jobs && play.jobs[id];
  if (far) return 0.6;
  return (job && job.type === 'man') || (awayFromQB && now[1] > 12) ? 0.5 : 0.35;
}

// A player's run from the release toward "goal", timed to get there at frame "due": he keeps his
// momentum, then slows down, speeds up or turns back as needed, within real limits.
// A receiver ("follow") keeps running his route, since a timing throw goes to where the route will
// take him, and shifts off it only by as much as the ball is off that spot. A defender leaves his
// coverage and goes straight for the ball. "shift" moves his path before he finds the ball: a man
// defender mirrors his receiver when the receiver changes course for the ball.
function chase(id, release, goal, due, reaction, top, follow = false, shift = null) {
  const first = Math.round(release / STEP), last = play.frames.length - 1;
  const route = (k) => {
    const p = play.frames[Math.max(0, Math.min(last, k))][id];
    if (!shift) return p;
    const s = shift(k);
    return [p[0] + s[0], p[1] + s[1]];
  };
  let at = route(first);
  const before = route(first - 6);
  let speed = [(at[0] - before[0]) / (6 * STEP), (at[1] - before[1]) / (6 * STEP)];
  const delay = Math.round(reaction / STEP), steps = [];
  const off = [goal[0] - route(due)[0], goal[1] - route(due)[1]];
  const span = Math.max(1, due - first - delay);
  // Where he wants to be at frame k: on his route, moved over toward the ball bit by bit.
  const track = (k) => {
    const u = ease(THREE.MathUtils.clamp((k - first - delay) / span, 0, 1)), p = route(k);
    return [p[0] + off[0] * u, p[1] + off[1] * u];
  };
  for (let k = first + 1; k <= Math.min(due, last); k++) {
    if (k - first <= delay) {
      // Still on his route while he finds the ball.
      const next = route(k);
      speed = [(next[0] - at[0]) / STEP, (next[1] - at[1]) / STEP];
      at = next;
    } else {
      const left = Math.max(0.15, (due - k) * STEP);
      let want;
      if (follow) {
        const here = track(k), ahead = track(k + 1);
        want = [(ahead[0] - here[0]) / STEP + (here[0] - at[0]) * 5, (ahead[1] - here[1]) / STEP + (here[1] - at[1]) * 5];
      } else want = [(goal[0] - at[0]) / left, (goal[1] - at[1]) / left];
      const wanted = Math.hypot(...want);
      if (wanted > top) want = [want[0] * top / wanted, want[1] * top / wanted];
      const change = [want[0] - speed[0], want[1] - speed[1]], amount = Math.hypot(...change);
      // On his route he can still make its cuts; only the extra adjustment for the ball is limited.
      let grip = BALL_GRIP;
      if (follow) {
        const a = route(k - 1), b = route(k), c = route(k + 1);
        grip += Math.hypot(c[0] - 2 * b[0] + a[0], c[1] - 2 * b[1] + a[1]) / (STEP * STEP);
      }
      const limit = Math.min(1, grip * STEP / (amount || 1));
      speed = [speed[0] + change[0] * limit, speed[1] + change[1] * limit];

// Where the intended receiver plays the ball, like a real receiver reading it in the air:
// - thrown in front of him and nobody close: he adjusts his speed (sits down in the window or
//   runs on to it) and catches it in stride where it comes down;
// - a defender closing on the spot, or the ball short of him: he works back toward the
//   quarterback along the ball's flight and catches it earlier, at a catchable height, in front of
//   the defender, up to about 5 yards back, but only where he can really get to in time with his
//   momentum. Otherwise he does what he can at the landing spot: reach, dive or fall short.
function catchPlan(path, release, id) {
  const arrive = Math.round((release + path.flight) / STEP), last = play.frames.length - 1;
  const first = Math.round(release / STEP);
  const now = play.frames[Math.min(last, first)][id], before = play.frames[Math.max(0, first - 6)][id];
  const moving = [now[0] - before[0], now[1] - before[1]];
  const landing = play.frames[Math.min(last, arrive)];

// Once the ball is in the air, nearby players leave their path to go and get it. This rewrites

// Defenders play the ball under the same real limits as the receiver (how soon they see it, how

function react(path, release) {

    // on the ball, the far ones later, since they have to find it first.

function resolve(path, release) {

  const intended = intendedFor(path, release);
  const actions = react(path, release);
  let result = null;
  for (let s = 0; !result; s += STEP / 2) {
    const ball = path.at(s), frame = frameAt(release + s), point = [ball.x, ball.d];
    if (ball.y <= 0.12 || Math.abs(ball.x) > WIDTH / 2 || ball.d > endLine) result = { outcome: 'incomplete', at: s };

        const defender = id in defence, receiver = ELIGIBLE.includes(id);

        // Reach in yards. Linemen are busy blocking, so they rarely touch the ball.
        const action = actions[id];
        // Fingertips go further for a player who is diving at the right moment.
        const diving = action && action.kind === 'dive' && release + s > action.arrive - 0.15;
        // A lineman fighting a block only bats a pass that goes right through his hands.
        const reach = (receiver ? 1.3 : rushing(id) ? 0.3 : 0.8) + (diving ? 1 : 0);
        const ratio = gap(spot, point) / reach;
        // Above head height only a jump gets there.
        const high = ball.y > 2.3;
        if (high && rushing(id)) continue;
        // A rusher locked up with a blocker cannot get his hands up into the passing lane in time;
        // he only gets a pass thrown low, at his body. An unblocked rusher can get his hands up.
        if (rushing(id) && ball.y > 1.9 && Object.keys(BLOCKS).some((b) => frame[b] && gap(frame[b], spot) < 1.3)) continue;
        // A player who is going to fall short cannot make the catch.
        if (action && action.kind === 'fall' && release + s > action.arrive - 0.15) continue;
        if (ratio <= 1 && ball.y > (receiver ? 0.45 : 0.3) && (!receiver || ball.traveled > 3) && (!best || ratio < best.ratio)) best = { id, ratio, defender };
      }
      if (best) result = { outcome: !best.defender ? 'complete' : square(path, release, s, best.id) ? 'intercepted' : 'deflected', by: best.id, at: s };
    }
  }
  // Which receiver was it meant for, and how accurate was the throw? Both are judged where the
  // ball was aimed to arrive, even if it was touched earlier.
  const arrival = planned;
  let target = result.by && ELIGIBLE.includes(result.by) ? result.by : null;
  if (!target) target = ELIGIBLE.reduce((a, b) => (gap(arrival[b], path.target) < gap(arrival[a], path.target) ? b : a));
  const miss = gap(arrival[target], path.target);
  if (miss > 7 && target !== result.by) target = null;
  const openness = target ? Math.min(...Object.keys(defence).map((k) => gap(arrival[k], arrival[target]))) : 0;
  // Whoever touched the ball above his head had to jump for it.
  if (result.by && path.at(result.at).y > 2.3) actions[result.by] = { kind: 'jump', arrive: release + result.at, toward: path.target.slice() };
  else if (result.by && !actions[result.by]) actions[result.by] = { kind: 'reach', arrive: release + result.at, toward: path.target.slice() };
  const caught = result.by && result.outcome !== 'deflected';
  return { ...result, release, path, target, miss, openness, actions, caught, arrival };
}

// The read agreed at step 0, per situation.
const READS = [
  { best: 'X' },
  { best: 'X', ok: 'Slot', allowed: (t) => t.openness >= 2 },
  { best: 'X', ok: 'Slot' },
  { best: 'Slot', ok: 'X', allowed: (t) => t.release < 1.5 },
];
function decision(thrown) {
  if (!thrown) return 'sack';
  if (thrown.away) return 'away';
  if (sit.classic !== null) {
    const read = READS[sit.classic];
    if (thrown.target === read.best) return 'good';
    if (thrown.target === read.ok && (!read.allowed || read.allowed(thrown))) return 'acceptable';
    return 'bad';
  }
  // Every other play is judged on how open the target really was when the ball arrived.
  if (!thrown.target || thrown.outcome === 'intercepted') return 'bad';
  if (thrown.openness >= OPEN_YARDS) return 'good';
  // The best read, thrown a little late or early, is still the right idea; when nobody gets open it is the right throw.
  if (thrown.target === sit.best.id) return sit.best.top < OPEN_YARDS ? 'good' : 'acceptable';
  return thrown.openness >= 2 ? 'acceptable' : 'bad';
}

// ---------------------------------------------------------------- Playing a rep
// phase: ready (before the snap), live (can still throw), watch (ball gone, sack or replay), over.
let phase = 'ready', play = null, time = 0, playing = false, slow = false, last = 0, startSpots = null;
let charge = null, series = null, recorded = false;
// lastRep: the most recent finished rep. resume: the rep to go back to after watching it again.
let lastRep = null, resume = null, watchingLast = false;

function resetPlay() {
  playing = false;
  play = null;
  time = 0;
  phase = 'ready';
  charge = null;
  recorded = false;
  if (typeof runners === 'undefined') return;
  for (const [id, r] of Object.entries(runners)) {
    r.body.visible = false;
    r.stance.visible = true;
    if (startSpots) everyone[id].position.copy(startSpots[id]);
  }
  startSpots = null;
  football.position.copy(BALL_START);
  marker.visible = false;
  for (const id of ['clock', 'result', 'power', 'cross']) $(id).hidden = true;
  controls();
}

function controls() {
  $('throw').disabled = $('lob').disabled = phase !== 'live';
  $('snap').textContent = phase === 'over' ? 'Replay (Space)' : 'Snap (Space)';
  $('snap').disabled = phase === 'live' || phase === 'watch';
  $('reveal').disabled = Boolean(series) && phase !== 'over';
  $('series').textContent = series ? `Rep ${Math.min(series.reps.length + (recorded ? 0 : 1), SERIES_LENGTH)} / ${SERIES_LENGTH}` : '10-rep series';
  $('series').classList.toggle('on', Boolean(series));
  $('watch').disabled = !lastRep || phase === 'live' || phase === 'watch';
  $('away').disabled = phase !== 'live';
  document.documentElement.classList.toggle('live', phase === 'live');
  if (DRIVE && driveOver) $('snap').disabled = true;
}

// Plays the previous rep again from the snap, with its result and coaching at the end.
// From a rep that has not been snapped yet, "Back to your rep" returns to it afterwards.
function watchLast() {
  if (!lastRep || phase === 'live' || phase === 'watch') return;
  const back = resume || (phase === 'ready' ? { sit, hide: hideNumber } : null);
  resetPlay();
  ({ sit, play, startSpots } = lastRep);
  if (sit.field) setField(sit.field.ball, sit.field.toGo);
  recorded = true;
  watchingLast = true;
  resume = back;
  hideNumber = false;
  $('answer').textContent = sit.answer;
  document.activeElement.blur();
  run('watch');
}

function placeBall() {
  const thrown = play.throw;
  if (!thrown || time < thrown.release) {
    football.position.lerpVectors(BALL_START, BALL_HELD, Math.min(1, time / 0.35));
    football.rotation.set(0, 0, 0);
    return;
  }
  const s = time - thrown.release;
  if (s >= thrown.at && thrown.by && thrown.outcome !== 'deflected') {
    // Caught or intercepted: the player carries it.
    const holder = thrown.actions[thrown.by];
    const dived = holder && holder.kind === 'dive' && !(holder.getUp && time - holder.arrive > GET_UP) ? ease(Math.min(1, Math.max(0, (time - holder.arrive) / 0.3))) : 0;
    // A tackled ball carrier takes the ball to the ground with him.
    const tackled = thrown.tackle ? ease(Math.min(1, Math.max(0, (time - thrown.tackle.at) / 0.4))) : 0;
    const onGround = Math.max(dived, tackled);
    football.position.copy(world(...frameAt(time)[thrown.by])).setY(1.2 - 0.9 * onGround);
    return;
  }
  const now = thrown.path.at(Math.min(s, thrown.at));
  const next = thrown.path.at(Math.min(s, thrown.at) + 0.02);
  const fall = s > thrown.at ? (s - thrown.at) * 4 : 0;
  football.position.copy(world(now.x, now.d)).setY(Math.max(0.1, now.y - fall));
  football.lookAt(world(next.x, next.d).setY(next.y));
}

// Overrides the running pose around the moment the ball arrives.
function reactionPose(r, action, id, spot) {
  const since = time - action.arrive;
  // Hands come up as the ball gets close.
  if (since < -0.5) return;
  const rise = ease(Math.min(1, (since + 0.5) / 0.35));
  const reachUp = (angle, spread, bend) => {
    for (const { arm, elbow, side } of r.arms) {
      arm.rotation.x += (angle - arm.rotation.x) * rise;
      arm.rotation.z = side * spread;
      elbow.rotation.x += (bend - elbow.rotation.x) * rise;
    }
  };
  const aim = Math.atan2(-(action.toward[0] - spot[0]), action.toward[1] - spot[1]);
  if (action.kind === 'reach') {
    // Hands come back down once the ball is secured, so a runner after the catch looks like one.
    if (since > 0.6) return;
    reachUp(1.7, 0.05, 0.6);
    return;
  }
  if (action.kind === 'jump') {
    if (since > 0.9) return;
    const u = (since + 0.3) / 0.6;
    if (u > 0 && u < 1) {
      const height = Math.sin(Math.PI * u);
      r.body.position.y = 0.75 * height;
      for (const { knee } of r.legs) knee.rotation.x = -0.4 - 0.7 * height;
    }
    reachUp(2.9, 0.12, 0.2);
    return;
  }
  // A ball carrier who dived for the catch is back on his feet and running.
  if (action.getUp && since > GET_UP) return;
  // Dive (a catch attempt at full stretch) and fall (a lunge that comes up short).
  const u = Math.max(0, Math.min(1, (since + 0.2) / 0.45));
  if (u === 0) return reachUp(2.2, 0.15, 0.4);
  const down = ease(u);
  if (Math.hypot(action.toward[0] - spot[0], action.toward[1] - spot[1]) > 0.3 && since < 0.1) r.body.rotation.y = aim;
  r.body.rotation.x = -1.45 * down;
  r.body.position.y = 0.45 * Math.sin(Math.PI * u) + 0.22 * down;
  // A player who misses lands off balance, on one side.
  if (action.kind === 'fall') r.body.rotation.z = 0.45 * down;
  for (const { leg, knee, side } of r.legs) {
    leg.rotation.x = (side > 0 ? 0.35 : -0.1) * down;
    leg.rotation.z = side * 0.12;
    knee.rotation.x = -(side > 0 ? 0.9 : 0.25) * down;
  }
  reachUp(action.kind === 'dive' ? 3 : 2.4, action.kind === 'dive' ? 0.1 : 0.7, 0.15);
}

// Places every player and the ball for time t.
function show(t) {
  // A run after the catch can make the play longer than the usual eight seconds.
  time = Math.max(0, Math.min(play.duration || DURATION, t));
  const index = Math.min(play.frames.length - 1, Math.round(time / STEP));
  const frame = play.frames[index], before = play.frames[Math.max(0, index - 6)];
  for (const [id, spot] of Object.entries(frame)) {
    const group = everyone[id], r = runners[id];
    group.position.copy(world(...spot));
    const dx = spot[0] - before[id][0], dd = spot[1] - before[id][1];
    const speed = Math.hypot(dx, dd) / Math.max(STEP, Math.min(6, index) * STEP);
    const moved = index > 0;
    r.stance.visible = !moved;
    r.body.visible = moved;
    if (!moved) continue;
    r.body.position.set(0, 0, 0);
    r.body.rotation.z = 0;
    // Linemen keep facing each other; others look where they run, or at the quarterback when slow or backpedalling.
    const toQB = Math.atan2(-(QB_SPOT[0] - spot[0]), QB_SPOT[1] - spot[1]);
    const heading = Math.atan2(-dx, dd);
    const lineman = id in MATCHUP || (id in BLOCKS && id !== 'RB');
    // Defenders keep their eyes on the quarterback while they backpedal or shuffle, but turn and run
    // once they are moving fast (a deep defender carrying a go route opens his hips and sprints).
    const backpedal = !(id in offenceByName) && ((dd > 0 && Math.abs(dx) < dd * 1.5 && speed < 5.5) || speed < 3.2);
    // A lineman is engaged while he has an opponent within reach.
    let partner = null;
    if (lineman) {
      let nearest = 1.6;
      for (const other of id in MATCHUP ? Object.keys(BLOCKS) : Object.keys(MATCHUP)) {
        const away = gap(spot, frame[other]);
        if (away < nearest) { nearest = away; partner = other; }
      }
    }
    if (partner) r.body.rotation.y = Math.atan2(-(frame[partner][0] - spot[0]), frame[partner][1] - spot[1]);
    else if ((id === 'RB' && !(id in sit.routes)) || (lineman && speed < 1.5)) r.body.rotation.y = r.home;
    else r.body.rotation.y = speed < 1.5 || backpedal ? toQB : heading;
    let distance = 0;
    for (let i = 1; i <= index; i += 3) {
      const a = play.frames[Math.max(0, i - 3)][id], b = play.frames[i][id];
      distance += Math.hypot(b[0] - a[0], b[1] - a[1]);
    }
    // Engaged players churn their feet even when they barely move.
    const swing = partner ? 0.35 : Math.min(0.85, speed * 0.13);
    const phaseOfRun = partner ? time * 11 + (id in MATCHUP ? 1.5 : 0) : distance * 2.2;
    r.body.rotation.x = partner ? (id in MATCHUP ? -0.1 : -0.03) : -Math.min(0.22, speed * 0.028);
    for (const { leg, knee, side } of r.legs) {
      leg.rotation.z = side * (partner ? 0.16 : 0);
      leg.rotation.x = Math.sin(phaseOfRun) * swing * side * (r.low ? 0.4 : 1) + (r.low ? 0.6 : 0.12);
      knee.rotation.x = -((r.low ? 1.15 : 0.25) + Math.max(0, Math.cos(phaseOfRun) * side) * swing * (r.low ? 0.5 : 1.4));
    }
    for (const { arm, elbow, side } of r.arms) {
      if (partner) {
        // Hands on the opponent's chest, pumping a little.
        const punch = Math.sin(time * 7 + side) * 0.12;
        arm.rotation.x = 1.3 + punch;
        arm.rotation.z = -side * 0.12;
        elbow.rotation.x = 0.3 - punch;
      } else {
        arm.rotation.x = -Math.sin(phaseOfRun) * swing * side * 1.1 + 0.15;
        arm.rotation.z = side * 0.08;
        elbow.rotation.x = 1.25;
      }
    }
    const action = play.throw && play.throw.actions[id];
    if (action) reactionPose(r, action, id, spot);
    // The tackle: the ball carrier goes down and the tackler dives into him.
    const tackle = play.throw && play.throw.tackle;
    if (tackle && (id === tackle.carrier || id === tackle.by)) {
      reactionPose(r, { kind: id === tackle.carrier ? 'fall' : 'dive', arrive: tackle.at, toward: tackle.spot }, id, spot);
    }
  }
  placeBall();
  const sacked = !play.throw && time >= play.sack;
  $('clock').hidden = false;
  $('clock').classList.toggle('late', sacked);
  const shown = play.throw ? Math.min(time, play.throw.release) : Math.min(time, play.sack);
  $('clock').textContent = (sacked ? 'Sack! ' : play.throw && time >= play.throw.release ? 'Thrown at ' : '') + `${shown.toFixed(1)} s`;
  updateAim();
  refresh();
}

// The landing spot while the throw is being charged.
function aimedDistance() {
  const held = (performance.now() - charge.since) / 1000;
  return Math.min(MAX_YARDS, MIN_YARDS + (MAX_YARDS - MIN_YARDS) * held / CHARGE_SECONDS);
}
function updateAim() {
  $('cross').hidden = phase !== 'live' || topView;
  marker.visible = Boolean(charge);
  $('power').hidden = !charge;
  if (!charge) return;
  const distance = aimedDistance();
  marker.position.copy(world(...trajectory(charge.type, yaw, distance).target)).setY(0.06);
  $('powerFill').style.width = `${(distance - MIN_YARDS) / (MAX_YARDS - MIN_YARDS) * 100}%`;
}

function startCharge(type) {
  if (phase !== 'live' || charge || time < 0.35) return;
  charge = { type, since: performance.now() };
}
function releaseThrow(type, distance, heading = yaw) {
  if (phase !== 'live') return;
  if (distance === undefined) {
    if (!charge || charge.type !== type) return;
    distance = aimedDistance();
  }
  charge = null;
  play.throw = resolve(trajectory(type, heading, distance), time);
  play.end = Math.min(DURATION, time + play.throw.at + 1.5);
  if (play.throw.outcome === 'complete') runToTackle(play.throw);
  phase = 'watch';
  updateAim();
  controls();
}
// Throw it away: a high lob well over the nearer sideline, so nobody can catch it.
function throwAway() {
  if (phase !== 'live') return;
  releaseThrow('lob', MAX_YARDS, yaw >= 0 ? 1.5 : -1.5);
  if (play.throw) play.throw.away = true;
}

// After the catch the ball carrier keeps running until he is tackled, steps out of bounds or
// scores. He heads for the goal line, cutting away from the nearest tacklers and away from the
// sideline; every defender chases him on an angle (aiming where he is going, not where he is),
// linemen more slowly. The first defender to reach him makes the tackle. The run is written into
// the play's frames, so it shows in 3D, in slow motion and in replays.
const CARRIER_SPEED = 7.4, TACKLE_REACH = 1.0, PURSUIT_DELAY = 0.25, MAX_PLAY = 30, GET_UP = 0.85;
const pursuitSpeed = (id) => (FRONT_FOUR.includes(id) ? 5.6 : /^LB/.test(id) ? 6.9 : 7.5);
function runToTackle(thrown) {
  const goal = sit.field ? sit.field.ball : 100 - (LOS_FROM_BACK - 10);
  const frames = play.frames, catchAt = thrown.release + thrown.at;
  const first = Math.min(frames.length - 1, Math.round(catchAt / STEP));
  const carrier = thrown.by, chasers = Object.keys(defence);
  const spot = frames[first][carrier];
  thrown.caughtAt = spot[1];
  let end = null;
  // A catch in the end zone is a touchdown. After a diving catch he gets back up and runs, unless
  // a defender touches him while he is down (down by contact).
  if (spot[1] >= goal) end = { kind: 'td', k: first };
  const dived = thrown.actions[carrier] && thrown.actions[carrier].kind === 'dive';
  if (dived) thrown.actions[carrier].getUp = true;
  const getUp = dived ? GET_UP : 0;
  const before = frames[Math.max(0, first - 6)][carrier];
  let vel = [(spot[0] - before[0]) / (6 * STEP), (spot[1] - before[1]) / (6 * STEP)];
  const chaseVel = Object.fromEntries(chasers.map((id) => [id, [0, 0]]));
  let k = first;
  while (!end && (k - first) * STEP < MAX_PLAY) {
    k++;
    // Past the planned frames, everybody else holds where they were.
    if (k >= frames.length) frames.push({ ...frames[k - 1] });
    const prev = frames[k - 1], now = frames[k], at = prev[carrier];
    const t = (k - first) * STEP;
    // The carrier: towards the goal line, pushed away from close defenders and the sideline.
    let want = [0, 1];
    if (t < getUp) { want = [0, 0]; vel = [0, 0]; }
    for (const id of chasers) {
      const away = [at[0] - prev[id][0], at[1] - prev[id][1]], dist = Math.hypot(...away) || 0.01;
      if (dist < 8 && prev[id][1] > at[1] - 3) { const push = 5 / (dist * dist); want[0] += away[0] / dist * push; want[1] += Math.max(0, away[1] / dist) * push * 0.3; }
    }
    if (Math.abs(at[0]) > 21) want[0] -= Math.sign(at[0]) * (Math.abs(at[0]) - 21) * 0.4;
    if (t < getUp) now[carrier] = at;
    else {
      const len = Math.hypot(...want) || 1;
      want = [want[0] / len * CARRIER_SPEED, want[1] / len * CARRIER_SPEED];
      const turn = Math.min(1, STEP * 5);
      vel = [vel[0] + (want[0] - vel[0]) * turn, vel[1] + (want[1] - vel[1]) * turn];
      now[carrier] = [at[0] + vel[0] * STEP, at[1] + vel[1] * STEP];
    }
    // The defenders: after a moment to react, run to cut him off.
    for (const id of chasers) {
      const from = prev[id];
      if (t < PURSUIT_DELAY) { now[id] = from; continue; }
      const speed = pursuitSpeed(id), dist = gap(from, now[carrier]);
      const lead = Math.min(1.2, dist / speed);
      const aim = [now[carrier][0] + vel[0] * lead, now[carrier][1] + vel[1] * lead];
      const l = gap(from, aim) || 1, target = [(aim[0] - from[0]) / l * speed, (aim[1] - from[1]) / l * speed];
      const cv = chaseVel[id], grip = Math.min(1, STEP * 4);
      cv[0] += (target[0] - cv[0]) * grip; cv[1] += (target[1] - cv[1]) * grip;
      now[id] = [from[0] + cv[0] * STEP, from[1] + cv[1] * STEP];
    }
    // How the run ends.
    if (now[carrier][1] >= goal) end = { kind: 'td', k };
    else if (Math.abs(now[carrier][0]) >= WIDTH / 2 - 0.5) end = { kind: 'out', k };
    else {
      let best = null;
      for (const id of chasers) { const d = gap(now[id], now[carrier]); if (d <= TACKLE_REACH && (!best || d < best.d)) best = { id, d }; }
      if (best) end = { kind: 'tackle', k, by: best.id };
    }
  }
  if (!end) end = { kind: 'down', k };
  // After the whistle: the carrier is brought down a step forward, the tackler with him, the rest ease up.
  const stop = frames[end.k][carrier], whistle = end.k * STEP;
  const fallTo = end.kind === 'tackle' ? [stop[0], stop[1] + 0.6] : stop;
  const settle = Math.round(1.2 / STEP);
  for (let j = 1; j <= settle; j++) {
    const kk = end.k + j;
    if (kk >= frames.length) frames.push({ ...frames[kk - 1] });
    const u = ease(Math.min(1, j * STEP / 0.35));
    frames[kk][carrier] = lerp2(stop, fallTo, u);
    for (const id of chasers) {
      const from = frames[kk - 1][id], cv = chaseVel[id], slow = Math.max(0, 1 - j * STEP / 0.6);
      frames[kk][id] = id === end.by ? lerp2(frames[end.k][id], [fallTo[0], fallTo[1] - 0.4], u) : [from[0] + cv[0] * STEP * slow, from[1] + cv[1] * STEP * slow];
    }
  }
  frames.length = Math.min(frames.length, end.k + settle + 1);
  if (end.kind === 'tackle') thrown.tackle = { by: end.by, carrier, at: whistle, spot: fallTo };
  thrown.td = end.kind === 'td';
  thrown.oob = end.kind === 'out';
  thrown.tackledBy = end.by ? end.by.replace(/\d$/, '') : '';
  thrown.gain = thrown.td ? goal : Math.round(fallTo[1]);
  play.duration = whistle + 1.2;
  play.end = play.duration;
}

const TITLES = { good: '✅ Good read', acceptable: '🟡 Acceptable read', nocatch: '🟡 Right idea, but no catch', bad: '❌ Bad read', sack: '❌ Sack',
  away: '↗ Thrown away' };
const number = (v) => v.toFixed(1);

// "Good read" and "Acceptable read" now need the receiver to catch the ball; a sound
// decision that ends incomplete, deflected or dropped is "Right idea, but no catch".
function grading(thrown) {
  const grade = decision(thrown);
  return (grade === 'good' || grade === 'acceptable') && thrown.outcome !== 'complete' ? 'nocatch' : grade;
}

const bestId = () => (sit.classic !== null ? READS[sit.classic].best : sit.best.id);
// Where the throw went compared with the receiver: long, short, inside or outside.
function missedBy(thrown) {
  const rec = thrown.arrival[thrown.target], aim = thrown.path.target;
  const dx = aim[0] - rec[0], dd = aim[1] - rec[1];
  if (Math.abs(dd) >= Math.abs(dx)) return dd > 0 ? 'too long (past him)' : 'short of him';
  return dx * (rec[0] < 0 ? -1 : 1) > 0 ? 'too far outside' : 'too far inside';
}
// Coaching points for the rep just played, from what everybody was doing when the ball arrived.
function coaching(thrown, grade) {
  const tips = [], best = bestId();
  if (!thrown) {
    tips.push(`You held the ball until the rush got home at ${number(play.sack)} s. Get it out about half a second sooner, or move on to the next read.`);
    tips.push(`The best read was ${receiverName(sit, best)}${sit.best ? `, open when thrown at about ${number(sit.best.when)} s` : ''}.`);
    return tips;
  }
  if (thrown.away) {
    if (sit.best && sit.best.top < OPEN_YARDS) tips.push('Smart: nobody got open, so you threw it away. No loss, and the clock stops.');
    else tips.push(`Thrown away: no loss, and the clock stops. But ${receiverName(sit, best)} got open${sit.best ? `, about ${number(sit.best.top)} yd when thrown at ${number(sit.best.when)} s` : ''}.`);
    return tips;
  }
  if (!thrown.target) {
    tips.push('The ball did not go near any receiver. Line up the yellow mark with your target, and hold the button longer for more distance.');
  } else {
    const room = thrown.openness;
    tips.push(`${receiverName(sit, thrown.target)} had ${number(room)} yd of space when the ball arrived: ${room >= OPEN_YARDS ? 'open' : room >= 2 ? 'a tight window' : 'covered'}.`);
    const space = (id) => Math.min(...Object.keys(defence).map((k) => gap(thrown.arrival[k], thrown.arrival[id])));
    const others = Object.keys(sit.routes).filter((id) => id !== thrown.target).map((id) => [id, space(id)]).sort((a, b) => b[1] - a[1]);
    if (others.length && others[0][1] >= OPEN_YARDS && others[0][1] > room + 1.5) tips.push(`${receiverName(sit, others[0][0])} was more open, with ${number(others[0][1])} yd.`);
    if (thrown.miss > 1.5) tips.push(`The throw was ${number(thrown.miss)} yd ${missedBy(thrown)}.`);
    if (sit.best && thrown.target === best && thrown.release > sit.best.when + 0.7) tips.push(`Right receiver, but late: his window opened around ${number(sit.best.when)} s and you threw at ${number(thrown.release)} s.`);
  }
  const by = thrown.by ? thrown.by.replace(/\d$/, '') : '';
  if (thrown.outcome === 'intercepted') tips.push(`The ${by} was sitting in the throwing lane. If nobody is open, throw it away rather than into coverage.`);
  else if (thrown.outcome === 'deflected' && ['DE', 'DT'].includes(by)) tips.push('A lineman batted it at the line. Throw through a gap in the rush, or put air under it with a lob.');
  else if (thrown.outcome === 'deflected') tips.push(`The ${by} got a hand on it. Lead the receiver away from the defender.`);
  if (grade === 'good') tips.push('Right read, on time, and caught. Keep doing that.');
  else if (grade === 'nocatch' && thrown.miss <= 1.5 && thrown.outcome === 'incomplete') tips.push('Good decision and a catchable ball; the receiver could not hold on to it.');
  return tips;
}

function finish() {
  playing = false;
  phase = 'over';
  const thrown = play.throw, grade = grading(thrown);
  // A replay of a rep that was already reported: tell the drive the replay is over.
  if (DRIVE && recorded) toDrive({ type: 'replay', on: false });
  const lines = [];
  if (thrown) {
    if (thrown.away) lines.push(`Thrown away after ${number(thrown.release)} s.`);
    else {
      lines.push(`Pass ${thrown.outcome}${thrown.by && thrown.outcome !== 'complete' ? ' by ' + thrown.by.replace(/\d$/, '') : ''}.`);
      lines.push(`Target: ${thrown.target ? receiverName(sit, thrown.target) : 'nobody'}. Thrown after ${number(thrown.release)} s.`);
      if (thrown.target) lines.push(`Accuracy: ${number(thrown.miss)} yd from the receiver. Closest defender: ${number(thrown.openness)} yd.`);
    }
    if (thrown.gain !== undefined) {
      lines.push(thrown.td ? 'Touchdown!' : `Gain of ${thrown.gain} yd: caught ${Math.round(thrown.caughtAt)} yd past the line, ${thrown.oob ? 'then ran out of bounds' : thrown.tackledBy ? `then tackled by the ${thrown.tackledBy}` : 'then down'}.`);
    }
  } else {
    lines.push(`The pressure arrived after ${number(play.sack)} s.`);
  }
  if (!recorded) {
    recorded = true;
    // Kept so the rep can be watched again after moving on.
    lastRep = { sit, play, startSpots };
    if (DRIVE) reportToDrive(thrown, grade);
    if (series) {
      series.reps.push({ situation: sit.name, concept: sit.concept, coverage: sit.coverage, blitz: play.blitz, grade, outcome: thrown ? thrown.outcome : 'sack', release: thrown ? thrown.release : null });
    }
  }
  const done = series && series.reps.length >= SERIES_LENGTH;
  $('resultTitle').textContent = (watchingLast ? 'Last rep: ' : '') + TITLES[grade];
  $('resultText').textContent = lines.join('\n') + '\n\nCoaching:\n• ' + coaching(thrown, grade).join('\n• ') + `\n\n${sit.answer}`;
  $('next').textContent = resume ? 'Back to your rep (Enter)' : DRIVE ? driveNextLabel() : done ? 'See summary (Enter)' : series ? 'Next (Enter)' : 'Try again (Enter)';
  $('result').hidden = false;
  $('next').hidden = false;
  $('replay').hidden = false;
  updateAim();
  controls();
}

// The one value in a list, or "Mixed" when the series used several.
const only = (list) => (new Set(list).size === 1 ? list[0] : 'Mixed');
function summary() {
  const reps = series.reps;
  const good = (list) => list.filter((r) => r.grade === 'good' || r.grade === 'acceptable').length;
  const thrown = reps.filter((r) => r.release !== null);
  const average = thrown.length ? thrown.reduce((sum, r) => sum + r.release, 0) / thrown.length : null;
  const withBlitz = reps.filter((r) => r.blitz), without = reps.filter((r) => !r.blitz);
  const count = (outcome) => reps.filter((r) => r.outcome === outcome).length;
  const result = { date: new Date().toISOString(), total: reps.length, goodReads: good(reps), completions: count('complete'),
    interceptions: count('intercepted'), sacks: count('sack'), averageRelease: average, reps };
  let saved = true;
  try {
    const record = { email: localStorage.getItem('qbsense_user') || 'guest', date: result.date, level: 1,
      accuracy: Math.round(result.goodReads / result.total * 100), correct: result.goodReads, total: result.total,
      avgTime: average === null ? null : Number(average.toFixed(2)),
      pressureAtt: withBlitz.length, pressureComp: good(withBlitz), concept: only(reps.map((r) => r.concept)), coverage: only(reps.map((r) => r.coverage)),
      completions: result.completions, interceptions: result.interceptions, sacks: result.sacks };
    const all = JSON.parse(localStorage.getItem('qbsense_readthrow_results') || '[]');
    localStorage.setItem('qbsense_readthrow_results', JSON.stringify([...all, record]));
  } catch (error) {
    saved = false;
  }
  $('resultTitle').textContent = 'Series summary';
  $('resultText').textContent = [
    `Good decisions: ${result.goodReads} / ${reps.length}`,
    `Completions: ${result.completions} / ${reps.length}`,
    `Interceptions: ${result.interceptions}   Sacks: ${result.sacks}`,
    `Average time to throw: ${average === null ? '--' : number(average) + ' s'}`,
    saved ? 'Saved to your Results and Progress.' : 'This series could not be saved.',
    `With blitz: ${good(withBlitz)} / ${withBlitz.length}   Without blitz: ${good(without)} / ${without.length}`,
  ].join('\n');
  series = null;
  // Copy the new series to the player's account; it stays in the browser if this fails.
  if (saved && window.qbSyncResults) window.qbSyncResults();
  $('next').textContent = 'Finish (Enter)';
  $('replay').hidden = true;
  $('result').hidden = false;
  controls();
}

function tick(now) {
  if (!playing) return;
  show(time + Math.min(0.1, (now - last) / 1000) * (slow ? 0.35 : 1));
  last = now;
  if (phase === 'live' && time >= play.sack) {
    charge = null;
    phase = 'watch';
    play.end = play.sack + 0.4;
    updateAim();
    controls();
  }
  if (time >= play.end) finish();
  else requestAnimationFrame(tick);
}

function run(nextPhase) {
  // "watch" from here is always a replay; the drive pauses its game clock meanwhile.
  if (DRIVE && nextPhase === 'watch') toDrive({ type: 'replay', on: true });
  phase = nextPhase;
  $('result').hidden = true;
  show(0);
  playing = true;
  last = performance.now();
  controls();
  requestAnimationFrame(tick);
}
// Starts a rep, or replays the finished one.
function snap() {
  if (phase === 'ready') {
    // In a drive, only a play the drive has set up can be snapped, and not after the drive ends.
    if (DRIVE && (driveOver || !sit.field)) return;
    startSpots = Object.fromEntries(Object.entries(everyone).map(([id, p]) => [id, p.position.clone()]));
    play = simulate(sit);
    play.end = DURATION;
    document.activeElement.blur();
    if (DRIVE) toDrive({ type: 'snapped' });
    run('live');
  } else if (phase === 'over') run('watch');
}

const newRep = pickPlay;
function next() {
  if (phase !== 'over') return;
  if (resume) {
    const back = resume;
    setPlay(back.sit);
    hideNumber = back.hide;
    refresh();
    return;
  }
  if (DRIVE) { if (pendingSetup) applySetup(pendingSetup); return; }
  if (series && series.reps.length >= SERIES_LENGTH) { summary(); return; }
  if (series) newRep();
  else if ($('resultTitle').textContent === 'Series summary') newRep();
  else setPlay(sit);
}
function abortSeries() {
  series = null;
  controls();
}

$('snap').onclick = snap;
$('watch').onclick = watchLast;
$('away').onclick = throwAway;
$('slow').onclick = () => { slow = !slow; $('slow').classList.toggle('on', slow); };
$('replay').onclick = snap;
$('next').onclick = next;
$('series').onclick = () => {
  if (series) return;
  series = { reps: [] };
  newRep();
};
// Picking a situation by hand leaves the series.
$('random').addEventListener('click', abortSeries);
for (const [id, type] of [['throw', 'bullet'], ['lob', 'lob']]) {
  $(id).addEventListener('pointerdown', (e) => { e.preventDefault(); startCharge(type); });
  addEventListener('pointerup', () => releaseThrow(type));
}
addEventListener('pointercancel', () => { charge = null; });
addEventListener('blur', () => { charge = null; });
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'KeyL') {
    e.preventDefault();
    if (e.repeat) return;
    if (phase === 'live') startCharge(e.code === 'Space' ? 'bullet' : 'lob');
    // In a drive, Space after a play moves on to the next play (the Replay button still replays).
    else if (e.code === 'Space') { if (DRIVE && phase === 'over') next(); else snap(); }
  } else if (e.key === 'Enter' && phase === 'over') { e.preventDefault(); next(); }
  else if (e.key.toLowerCase() === 's' && !DRIVE) $('slow').click();
  else if (e.key.toLowerCase() === 'w') watchLast();
  else if (e.key.toLowerCase() === 't') throwAway();
  else if (e.key.toLowerCase() === 'r') abortSeries();
  // Timeout, spike and field goal belong to the drive.
  else if (DRIVE && ['m', 'p', 'k'].includes(e.key.toLowerCase())) toDrive({ type: 'key', key: e.key.toLowerCase() });
});

// ---------------------------------------------------------------- Drive mode bridge
// The Two-Minute Drill sends each play's set-up ("setup"), and can snap, throw it away or end the
// drive. This page reports the snap, every result, and when a replay starts and stops.
let pendingSetup = null, driveOver = false;
function toDrive(message) {
  if (DRIVE && parent !== window) parent.postMessage({ source: 'qb3d', ...message }, location.origin);
}
function applySetup(s) {
  pendingSetup = null;
  const concept = s.concept === 'random' ? randomOf(Object.keys(CONCEPTS)) : s.concept;
  const coverage = s.coverage === 'random' ? randomOf(Object.keys(COVERAGES)) : s.coverage;
  hideNumber = true;
  yaw = 0;
  pitch = -0.08;
  setPlay(makePlay(concept, coverage, { field: { ball: s.ball, toGo: s.toGo }, sackBonus: s.sackBonus || 0 }));
}
function driveNextLabel() { return driveOver ? 'Drive over' : pendingSetup ? 'Next play (Enter)' : 'Next play'; }
function reportToDrive(thrown, grade) {
  const nobodyOpen = Boolean(sit.best && sit.best.top < OPEN_YARDS);
  toDrive({ type: 'result', outcome: thrown ? thrown.outcome : 'sack', away: Boolean(thrown && thrown.away),
    gain: thrown && thrown.gain !== undefined ? thrown.gain : 0, td: Boolean(thrown && thrown.td), oob: Boolean(thrown && thrown.oob),
    time: thrown ? thrown.release : play.sack, grade, title: TITLES[grade],
    // A correct decision: a caught good or acceptable read, or throwing it away when nobody got open.
    correct: grade === 'good' || grade === 'acceptable' || (grade === 'away' && nobodyOpen),
    by: thrown && thrown.by ? thrown.by.replace(/\d$/, '') : '', concept: sit.concept, coverage: sit.coverage, note: sit.note || '', blitz: play.blitz });
}
addEventListener('message', (e) => {
  if (!DRIVE || e.source !== parent || e.origin !== location.origin || !e.data || e.data.source !== 'qb-drive') return;
  const m = e.data;
  if (m.type === 'setup') {
    driveOver = false;
    // "fresh" starts a new drive: load the play at once, whatever is on screen.
    if (phase === 'ready' || m.fresh) applySetup(m);
    else { pendingSetup = m; if (phase === 'over') $('next').textContent = driveNextLabel(); }
  } else if (m.type === 'snap') {
    // From the result card, the drive's Snap button first brings up the next play so it can be read.
    if (phase === 'ready') snap();
    else if (phase === 'over' && pendingSetup) next();
  }
  else if (m.type === 'throwaway') throwAway();
  else if (m.type === 'hud') document.documentElement.classList.toggle('hud', Boolean(m.on));
  else if (m.type === 'end') {
    driveOver = true;
    pendingSetup = null;
    if (phase === 'over') $('next').textContent = driveNextLabel();
    controls();
  }
});
addEventListener('keyup', (e) => {
  // Space would also press whichever button has the focus.
  if (e.code === 'Space') { e.preventDefault(); releaseThrow('bullet'); }
  else if (e.code === 'KeyL') releaseThrow('lob');
});

fillMenus();
randomSituation();
resize();
toDrive({ type: 'ready' });
// Used by automated checks.
window.qb = { offence, defence, setSituation, setPlay, makePlay, CONCEPTS, COVERAGES, snap, simulate, assignments: classicAssignments, SACK_RANGE,
  current: () => sit,
  phase: () => phase,
  aim: (heading) => { yaw = heading; refresh(); },
  seek: (t) => { playing = false; show(t); },
  // Throws at a chosen moment, direction and distance, then jumps to the result.
  testThrow: (index, type, release, heading, distance) => {
    if (typeof index === 'number') setSituation(index); else setPlay(index);
    snap(); playing = false; show(release); yaw = heading; releaseThrow(type, distance);
    const thrown = play.throw; show(play.end); finish();
    return { outcome: thrown.outcome, by: thrown.by, target: thrown.target, miss: +thrown.miss.toFixed(1), title: $('resultTitle').textContent,
      touched: +(thrown.release + thrown.at).toFixed(2), lands: +(thrown.release + thrown.path.flight).toFixed(2) };
  },
  frames: (index) => simulate(index, 0.5).frames, trajectory, lastPlay: () => play,
  actions: () => (play && play.throw ? Object.fromEntries(Object.entries(play.throw.actions).map(([id, a]) => [id, a.kind])) : {}), count: offence.length + 1 + Object.keys(defence).length };
</script>
<script type="module" src="auth-guard.js"></script>
<script type="module" src="plan-gate.js"></script>
<script type="module" src="results-sync.js"></script>
</body>
