<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Playbook | QB Sense VR</title>
<style>
:root{--navy:#0A1628;--green:#14532D;--bg:#F6F7F9;--muted:#5B6B7C;--border:#E2E8F0}
body{margin:0;background:var(--bg);font-family:system-ui,Arial,sans-serif;color:#111827}
header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
header h1{margin:0;font-size:20px;font-weight:900;text-transform:uppercase}
header a{color:#fff;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;border:1px solid rgba(255,255,255,.4);padding:8px 12px;border-radius:6px}
main{max-width:760px;margin:0 auto;padding:18px 14px 48px}
.card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:14px}
h2{text-transform:uppercase;margin:0 0 8px}
.btn{background:var(--green);color:#fff;border:0;border-radius:6px;padding:12px 18px;font-weight:800;cursor:pointer;text-transform:uppercase;text-decoration:none;display:inline-block}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--border)}
textarea{width:100%;min-height:260px;padding:12px;border:1px solid var(--border);border-radius:8px;font-family:monospace;font-size:13px}
#status{font-weight:800;min-height:22px;margin:10px 0}
.hidden{display:none}
</style>
</head>
<body>
<header><h1>Team Playbook</h1><a href="index.html#drills">Back to drills</a></header>
<main>
<div class="card">
<h2>Upload playbook</h2>
<p>Paste your team playbook as JSON. Each play needs a <b>name</b>, <b>concept</b>, and a <b>routes</b> array using the same route format as the drills.</p>
<textarea id="pbText" placeholder="Paste playbook JSON here"></textarea>
<div id="status"></div>
<button class="btn" id="save">Save playbook</button>
<button class="btn ghost" id="activate">Activate team playbook</button>
<button class="btn ghost" id="deactivate">Use default plays</button>
<button class="btn ghost" id="clear">Clear saved playbook</button>
</div>
<div class="card">
<h2>Current status</h2>
<p><b>Playbook:</b> <span id="pbStatus">Default plays</span></p>
<p><b>Saved plays:</b> <span id="pbCount">0</span></p>
</div>
</main>
<script src="playbook.js"></script>
<script>
function $(i){return document.getElementById(i)}
function setStatus(msg,good){var s=$('status');s.textContent=msg;s.style.color=good?'#14532D':'#DC2626'}
function validPlay(p){
if(!p||typeof p!=='object')return false;
if(!p.name||!p.concept)return false;
if(!Array.isArray(p.r)||!p.r.length)return false;
return p.r.every(function(r){return r&&typeof r.n==='string'&&typeof r.x==='number'&&typeof r.y==='number'&&Array.isArray(r.p)&&r.p.length&&typeof r.c==='string'});
}
function updStatus(){
var team=getTeamPlaybook();
var active=team&&isTeamPlaybookActive();
$('pbStatus').textContent=active?'Team playbook active':'Default plays';
$('pbCount').textContent=team?team.plays.length:0;
}
$('save').addEventListener('click',function(){
try{
var data=JSON.parse($('pbText').value);
if(!data||!Array.isArray(data.plays)||!data.plays.length){setStatus('Playbook must include a plays array.',false);return}
var bad=data.plays.findIndex(function(p){return !validPlay(p)});
if(bad>=0){setStatus('Play '+(bad+1)+' is missing a valid name, concept, or routes.',false);return}
saveTeamPlaybook(data);setStatus('Saved '+data.plays.length+' plays.',true);updStatus();
}catch(e){setStatus('Could not read the JSON. Check the format.',false)}
});
$('activate').addEventListener('click',function(){
if(!getTeamPlaybook()){setStatus('Save a playbook first.',false);return}
setTeamPlaybookActive(true);setStatus('Team playbook activated.',true);updStatus();
});
$('deactivate').addEventListener('click',function(){setTeamPlaybookActive(false);setStatus('Using default plays.',true);updStatus()});
$('clear').addEventListener('click',function(){clearTeamPlaybook();setTeamPlaybookActive(false);$('pbText').value='';setStatus('Saved playbook cleared.',true);updStatus()});
updStatus();
</script>
<script src="back-button.js"></script>
</body>
</html>
