<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QB Sense VR — Log In</title>
<style>
:root{--navy:#081729;--blue:#2f6bff;--cyan:#22d3ee;--muted:#9fb3d1}
*{box-sizing:border-box;font-family:'Inter',system-ui,Arial,sans-serif}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:#fff;background:radial-gradient(circle at 15% 20%,rgba(34,211,238,.28),transparent 40%),radial-gradient(circle at 85% 15%,rgba(109,141,255,.38),transparent 45%),linear-gradient(135deg,#081729,#123a6b 60%,#1c4d8f)}
.card{position:relative;width:100%;max-width:430px;border-radius:26px;padding:36px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);box-shadow:0 30px 70px rgba(0,0,0,.35);backdrop-filter:blur(18px)}
.card:before{content:'';position:absolute;inset:0;border-radius:26px;background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.1),transparent 35%);pointer-events:none}
.badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);padding:7px 13px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
h1{margin:18px 0 8px;font-size:34px;letter-spacing:-.03em;line-height:1.1}
p{margin:0 0 26px;color:#d7e4f7;font-size:15px;line-height:1.5}
label{display:block;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#c9d8ee;margin:0 0 7px}
input{width:100%;padding:14px 16px;border:1px solid rgba(255,255,255,.2);border-radius:14px;margin-bottom:16px;font-size:15px;color:#fff;background:rgba(255,255,255,.08)}
input::placeholder{color:#9fb3d1}
input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 4px rgba(34,211,238,.18)}
button{width:100%;padding:15px;border:0;border-radius:14px;background:#fff;color:#081729;font-size:16px;font-weight:850;cursor:pointer;transition:.2s;box-shadow:0 12px 28px rgba(255,255,255,.15)}
button:hover{transform:translateY(-2px)}
.error{display:none;background:rgba(255,77,90,.16);border:1px solid rgba(255,77,90,.35);color:#ffd7db;padding:11px 14px;border-radius:12px;font-size:13px;margin-bottom:16px}
.demo{margin:18px 0 0;font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="card">
<span class="badge">● QB Training System</span>
<h1>Welcome back</h1>
<p>Log in to continue training your reads, pocket presence, and decision-making under pressure.</p>
<div id="error" class="error">Please enter an email and password.</div>
<form onsubmit="return login(event)">
<label for="email">Email</label>
<input id="email" type="email" placeholder="you@example.com" required>
<label for="password">Password</label>
<input id="password" type="password" placeholder="Enter your password" required>
<button type="submit">Log In →</button>
</form>
<p class="demo">Demo version: any email and password will open the prototype.</p>
</div>
<script>
function login(event){
  event.preventDefault();
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value.trim();
  if(!email || !password){
    document.getElementById('error').style.display='block';
    return false;
  }
  localStorage.setItem('qbsense_user',email);
  window.location.href='index.html';
  return false;
}
</script>
</body>
</html>
