<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QB Sense VR — Coach Sign In</title>
<style>
:root{--navy:#0A1628;--green:#14532D;--green-2:#166534;--gold:#F59E0B;--bg:#F6F7F9;--card:#fff;--muted:#5B6B7C;--border:#E2E8F0}
*{box-sizing:border-box;font-family:'Archivo',system-ui,Arial,sans-serif}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#111827;position:relative;overflow:hidden;background:radial-gradient(circle at 12% 88%,rgba(20,83,45,.6),transparent 45%),radial-gradient(circle at 88% 12%,rgba(245,158,11,.14),transparent 42%),linear-gradient(160deg,#0A1628 0%,#0E2136 55%,#0A1628 100%)}
.field-bg{position:absolute;inset:0;pointer-events:none}
.turf{position:absolute;left:0;right:0;top:35%;bottom:0;background:linear-gradient(180deg,rgba(20,83,45,0) 0%,rgba(20,83,45,.45) 30%,rgba(20,83,45,.6) 100%)}
.yardlines{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9.7%,rgba(255,255,255,.07) 9.7% 10%)}
.hashmarks{position:absolute;left:0;right:0;top:50%;height:2px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 6px,transparent 6px 24px)}
.numbers{position:absolute;left:0;right:0;top:42%;display:flex;justify-content:space-around;color:rgba(255,255,255,.12);font-weight:900;font-size:22px;letter-spacing:.1em}
.login-wrap{position:relative;z-index:1;width:100%;max-width:480px;padding:20px}
.logo{ text-align:center;margin-bottom:26px }
.logo h1{margin:0;font-size:32px;font-weight:900;letter-spacing:-.02em;text-transform:uppercase;color:#fff}
.logo p{margin:5px 0 0;font-size:12px;color:#9CA3AF;letter-spacing:.08em;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:32px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.tabs{display:flex;gap:8px;margin-bottom:22px}
.tabs button{flex:1;border:1px solid var(--border);background:#fff;color:var(--navy);padding:11px;border-radius:6px;font-weight:800;font-size:13px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;transition:.15s}
.tabs button.active{background:var(--green);color:#fff;border-color:var(--green)}
.field{margin-bottom:18px}
.field label{display:block;margin-bottom:7px;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.field input{width:100%;padding:13px;border:1px solid var(--border);border-radius:6px;font-size:15px;background:#fff;color:#111827}
.field input:focus{outline:2px solid var(--green);outline-offset:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;width:100%;border:0;border-radius:6px;padding:15px 20px;font-weight:800;cursor:pointer;transition:.15s;font-size:14px;letter-spacing:.05em;text-transform:uppercase}
.btn.primary{background:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-2)}
.note{margin-top:15px;font-size:12px;color:var(--muted);text-align:center}
.error{margin-top:10px;font-size:13px;color:#DC2626;text-align:center;display:none}
.hidden{display:none}
</style>
</head>
<body>
<div class="field-bg">
<div class="turf"></div>
<div class="yardlines"></div>
<div class="hashmarks"></div>
<div class="numbers"><span>10</span><span>20</span><span>30</span><span>40</span><span>50</span><span>40</span><span>30</span><span>20</span><span>10</span></div>
</div>
<div class="login-wrap">
<div class="logo">
<h1>QB Sense VR</h1>
<p>Train the read. Feel the pressure. Make the throw.</p>
</div>
<div class="card">
<div class="tabs">
<button id="tabSignin" class="active" onclick="showTab('signin')">Sign In</button>
<button id="tabSignup" onclick="showTab('signup')">Create Account</button>
</div>
<form id="signinForm" onsubmit="return handleSignin(event)">
<div class="field"><label for="signinEmail">Coach email</label><input type="email" id="signinEmail" placeholder="you@team.com" required></div>
<div class="field"><label for="signinPassword">Password</label><input type="password" id="signinPassword" placeholder="••••••••" required></div>
<button class="btn primary" type="submit">Sign In</button>
<div class="error" id="signinError">Invalid email or password.</div>
</form>
<form id="signupForm" class="hidden" onsubmit="return handleSignup(event)">
<div class="field"><label for="signupName">Player/Coach name</label><input type="text" id="signupName" placeholder="Player/Coach Name" required></div>
<div class="field"><label for="signupEmail">Player/Coach email</label><input type="email" id="signupEmail" placeholder="you@team.com" required></div>
<div class="field"><label for="signupPassword">Password</label><input type="password" id="signupPassword" placeholder="Create a password" minlength="6" required></div>
<button class="btn primary" type="submit">Create Account</button>
<div class="error" id="signupError">Could not create account. Try again.</div>
</form>
<div class="note">By signing in you agree to the QB Sense VR terms.</div>
</div>
</div>
<script>
function showTab(tab){
 document.getElementById('tabSignin').classList.toggle('active',tab==='signin');
 document.getElementById('tabSignup').classList.toggle('active',tab==='signup');
 document.getElementById('signinForm').classList.toggle('hidden',tab!=='signin');
 document.getElementById('signupForm').classList.toggle('hidden',tab!=='signup');
}
function handleSignin(e){
 e.preventDefault();
 const email=document.getElementById('signinEmail').value.trim();
 const password=document.getElementById('signinPassword').value;
 const users=JSON.parse(localStorage.getItem('qbsense_users')||'{}');
 if(users[email] && users[email].password===password){
   localStorage.setItem('qbsense_user',email);
   window.location.href='index.html';
   return false;
 }
 document.getElementById('signinError').style.display='block';
 return false;
}
function handleSignup(e){
 e.preventDefault();
 const name=document.getElementById('signupName').value.trim();
 const email=document.getElementById('signupEmail').value.trim();
 const password=document.getElementById('signupPassword').value;
 const users=JSON.parse(localStorage.getItem('qbsense_users')||'{}');
 if(users[email]){document.getElementById('signupError').textContent='An account with this email already exists.';document.getElementById('signupError').style.display='block';return false;}
 users[email]={name:name,password:password,createdAt:new Date().toISOString()};
 localStorage.setItem('qbsense_users',JSON.stringify(users));
 localStorage.setItem('qbsense_user',email);
 window.location.href='index.html';
 return false;
}
</script>
</body>
</html>
