<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QB Sense VR — Log In</title>
<style>
:root{--navy:#0b1f3a;--blue:#1657ff;--green:#19c37d;--bg:#f4f7fb;--card:#fff}
*{box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0b1f3a,#1657ff);color:#12213a}
.card{background:var(--card);width:100%;max-width:400px;border-radius:20px;padding:32px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
h1{margin:0 0 6px;font-size:26px;color:var(--navy)}
p{margin:0 0 22px;color:#5b6b83;font-size:14px}
label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
input{width:100%;padding:12px 14px;border:1px solid #d7e0ee;border-radius:12px;margin-bottom:14px;font-size:15px}
input:focus{outline:2px solid var(--blue);border-color:var(--blue)}
button{width:100%;padding:13px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
button:hover{filter:brightness(1.08)}
.demo{margin-top:14px;font-size:12px;color:#67748b;text-align:center}
.error{display:none;background:#ffe9ec;color:#b4232f;padding:10px;border-radius:10px;font-size:13px;margin-bottom:12px}
</style>
</head>
<body>
<div class="card">
<h1>QB Sense VR</h1>
<p>Train the read. Feel the pressure. Make the throw.</p>
<div id="error" class="error">Please enter an email and password.</div>
<form onsubmit="return login(event)">
<label for="email">Email</label>
<input id="email" type="email" placeholder="you@example.com" required>
<label for="password">Password</label>
<input id="password" type="password" placeholder="Enter your password" required>
<button type="submit">Log In</button>
</form>
<p class="demo">Demo version: any email and password will open the prototype.</p>
</div>
<script>
function login(event){
  event.preventDefault();
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value.trim();
  if(!email || !password){
    document.getElementById('error').style.display='block';
    return false;
  }
  localStorage.setItem('qbsense_user',email);
  window.location.href='index.html';
  return false;
}
</script>
</body>
</html>
